# ===== VPN Provisioner API Configuration =====
# Файл: /etc/nginx/snippets/vpn-api.conf
# Подключается в основной конфигурации через: include /etc/nginx/snippets/vpn-api.conf;
# Express.js API на порту 8080
# Все пути идут через префикс /xray/ чтобы не конфликтовать с VPN Bot (порт 3001)

# Health check endpoint
location = /xray/health {
    rewrite ^/xray/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# Авторизация (Telegram auth, bot registration, JWT refresh)
location /xray/auth/ {
    rewrite ^/xray/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Telegram-Web-App-Data $http_telegram_web_app_data;
    
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# Bot API (для Telegram бота - использует bot secret)
location /xray/bot/ {
    rewrite ^/xray/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header x-bot-secret $http_x_bot_secret;
    
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# Payment webhook (Telegram Stars payments)
location /xray/webhook/ {
    rewrite ^/xray/(.*)$ /$1 break;
